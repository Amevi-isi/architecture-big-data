version: "3"

services:
  # Zookeeper - Coordination pour Kafka et HBase
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - datalake_network
    restart: always

  # Kafka - Ingestion de données en streaming
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CREATE_TOPICS=iot_data:1:1,web_clicks:1:1,transactions:1:1,social_media:1:1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - datalake_network
    restart: always

  # NiFi - Pour l'ingestion et le traitement des données
  nifi:
    build:
      context: .
      dockerfile: Dockerfile.nifi
    container_name: nifi
    user: "nifi"
    ports:
      - "8081:8080"
     #- "8443:8443"
    environment:
#     - NIFI_WEB_HTTP_PORT=8080
#      - NIFI_WEB_HTTP_HOST=0.0.0.0
#      - NIFI_WEB_HTTPS_PORT=8443
#      - NIFI_REMOTE_INPUT_HTTPS_ENABLED=false
#      - NIFI.REMOTE.INPUT.SECURE=false
#      - NIFI_SECURITY_USER_AUTHENTICATION=NONE
      - NIFI_SECURITY_USER_AUTHENTICATION=SINGLE_USER
      - NIFI_CLUSTER_IS_NODE=false
      - NIFI_SENSITIVE_PROPS_KEY=nifikey123456
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=adminpassword
      - HADOOP_USER_NAME=admin
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_logs:/opt/nifi/nifi-current/logs
     #- nifi_conf:/opt/nifi/nifi-current/conf
      - hadoop_data:/opt/hadoop
      - hbase_data:/opt/hbase
      - ../input_data:/input_data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
    dns:
      - 8.8.8.8
    networks:
      - datalake_network
    restart: always

  # NameNode - HDFS - serveur primaire
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    volumes:
      - namenode:/hadoop/dfs/name
      - ./hadoop_data:/home/hadoop_data
      #- ./init-hdfs.sh:/init-hdfs.sh  # Script pour créer /user/hive/warehouse
      - ./init-hadoop.sh:/init-hadoop.sh
    environment:
      - CLUSTER_NAME=test
      
    env_file:
      - ./hadoop-hive.env
    ports:
      - "51070:50070"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50070"]
      interval: 30s
      timeout: 10s
      retries: 5
    hostname: namenode
    networks:
      - datalake_network
    restart: always

  # DataNode - HDFS data storage
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    volumes:
      - datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
    ports:
      - "51075:50075"
    depends_on:
      - namenode
    networks:
      - datalake_network
    restart: always

  # HBase Master - Base de données NoSQL sur HDFS
  hbase-master:
    image: harisekhon/hbase:1.4
    container_name: hbase-master
    ports:
      - "16000:16000"  # HBase Master port
      - "16010:16010"  # HBase Web UI
      - "16020:16020"  # RegionServer port
      - "16030:16030"  # RegionServer Web UI
    environment:
      - HBASE_MANAGES_ZK=false  # Using external ZooKeeper
      - HBASE_ZOOKEEPER_QUORUM=zookeeper:2181  # Full ZK connection string
      - HBASE_ROOT_DIR=hdfs://namenode:9000/hbase  # HDFS storage path
      - HBASE_CLUSTER_DISTRIBUTED=true
      - HBASE_REGIONSERVER_HOSTNAME=hbase-regionserver  # If using RegionServer
      - HADOOP_CONF_DIR=/etc/hadoop/conf
    volumes:
      - ./hadoop-conf:/etc/hadoop/conf  # Mount Hadoop config files
      - hbase_data:/hbase-data # Persistent data
    depends_on:
      - zookeeper
      - namenode
      - datanode  # HBase needs DataNodes for HDFS storage
    networks:
      - datalake_network
    restart: always

  # Spark Master - Pour le traitement des données
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
     #- spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
     #- spark.sql.catalogImplementation=hive
      # Configuration YARN
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
     #- HADOOP_CONF_DIR=/opt/bitnami/spark/conf
      - SPARK_MASTER_URL=spark://spark-master:7077
      - HADOOP_CONF_DIR=/opt/bitnami/spark/conf
      - SPARK_HADOOP_YARN_RESOURCEMANAGER_HOST=resourcemanager
      - SPARK_HADOOP_YARN_RESOURCEMANAGER_PORT=8032
      - SPARK_HADOOP_YARN_NODEMANAGER_HOST=nodemanager
      - SPARK_HADOOP_YARN_NODEMANAGER_PORT=8042
      - SPARK_LOCAL_DIRS=/opt/bitnami/spark/tmp
      - SPARK_CONF_DIR=/opt/bitnami/spark/conf
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_WEBUI_PORT=8080
    env_file:
      - ./hadoop-hive.env
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ../postgresql-jdbc.jar:/opt/spark/jars/postgresql-jdbc.jar
      - ./hadoop-conf:/opt/bitnami/spark/conf
      - spark_data:/opt/bitnami/spark/tmp
      - ./spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - datalake_network
    restart: always

  # Spark Worker - Pour le traitement des données
  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
      - namenode
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no  
      # Yarn integration
      - SPARK_HADOOP_YARN_RESOURCEMANAGER_HOST=resourcemanager
      - SPARK_HADOOP_YARN_RESOURCEMANAGER_PORT=8032
      - SPARK_HADOOP_YARN_NODEMANAGER_HOST=nodemanager
      - SPARK_HADOOP_YARN_NODEMANAGER_PORT=8042
    env_file:
      - ./hadoop-hive.env
    volumes:
      - spark_data:/opt/bitnami/spark/data
    networks:
      - datalake_network
    restart: always

  # Spark Shell - Interface interactive pour Spark
 
  spark-shell:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-shell
    depends_on:
      - spark-master
      - namenode
      - hive-metastore
    environment:
      - SPARK_MODE=client
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_JARS_PACKAGES=io.delta:delta-core_2.12:3.2.0
     #- spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
    env_file:
      - ./hadoop-hive.env
    command: >
      bash -c "until curl -f http://spark-master:8080; do echo 'Waiting for spark-master...'; sleep 5; done &&
              until curl -f http://namenode:50070; do echo 'Waiting for namenode...'; sleep 5; done &&
              until curl -s http://hive-server:10000/; do echo 'Waiting for Hive Server...';  sleep 5; done "
    volumes:
      - spark_data:/opt/bitnami/spark/data
      - ./spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    networks:
      - datalake_network
    restart: always
 
# Hive Server - Utilise la configuration fonctionnelle
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    env_file:
      - ./hadoop-hive.env
    volumes:
      - ./extensions/hive-hcatalog-core-2.3.2.jar:/opt/hive/lib/hive-hcatalog-core-2.3.2.jar
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - datalake_network
    restart: always

  # Hive Metastore - Utilise la configuration fonctionnelle
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./hadoop-hive.env
    volumes:
      - ./extensions/hive-hcatalog-core-2.3.2.jar:/opt/hive/lib/hive-hcatalog-core-2.3.2.jar
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"
    networks:
      - datalake_network
    restart: always

  # PostgreSQL pour Hive Metastore - Utilise la configuration fonctionnelle
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    networks:
      - datalake_network
    restart: always

  # hue service
  hue:
    image: gethue/hue:latest
    container_name: hue
    depends_on:
      - hive-server
      - namenode
      - hive-metastore
    ports:
      - "8889:8888"  # Port de l'interface web Hue
    environment:
      - HUE_IGNORE_DEFAULT_CONFIG=true
      - HUE_DATABASE_TYPE=postgresql
      - HUE_DATABASE_HOST=hive-metastore-postgresql
      - HUE_DATABASE_PORT=5432
      - HUE_DATABASE_USER=hive
      - HUE_DATABASE_PASSWORD=hive
      - HUE_DATABASE_NAME=metastore
      - HUE_HIVE_SERVER_HOST=hive-server
      - HUE_HIVE_SERVER_PORT=10000
      - HUE_HIVE_METASTORE_HOST=hive-metastore
      - HUE_HIVE_METASTORE_PORT=9083
      - HUE_YARN_RESOURCEMANAGER_HOST=resourcemanager
      - HUE_YARN_RESOURCEMANAGER_PORT=8088
      - HUE_YARN_PROXY_API_URL=http://resourcemanager:8088
    env_file:
      - ./hadoop-hive.env
    volumes:
      - hue_data:/var/lib/hue
      - ./hue.ini:/usr/share/hue/desktop/conf/z-hue.ini
    networks:
      - datalake_network
    restart: always

  # Presto Coordinator - Pour les requêtes SQL
  presto-coordinator:
    image: shawnzhu/prestodb:0.181
    container_name: presto-coordinator
    ports:
      - "8080:8080"
    networks:
      - datalake_network
    restart: always

  spark-jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-jupyter
    depends_on:
      - spark-master
      - namenode
    environment:
      #- SPARK_MASTER=spark://spark-master:7077
      - JUPYTER_TOKEN=datalake
      - SPARK_MASTER=yarn
      - HADOOP_CONF_DIR=/etc/hadoop/conf
    env_file:
      - ./hadoop-hive.env
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./extensions/hive-hcatalog-core-2.3.2.jar:/opt/hive/lib/hive-hcatalog-core-2.3.2.jar
      - ./hadoop-conf:/etc/hadoop/conf
    ports:
      - "8888:8888"
    networks:
      - datalake_network
    restart: always

  # YARN ResourceManager - Gestion des ressources cluster
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop2.7.4-java8
    container_name: resourcemanager
    depends_on:
      - namenode
      - datanode
    env_file:
      - ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075"
    ports:
      - "8088:8088"  # YARN Web UI
      - "8032:8032"  # ResourceManager scheduler
      - "8030:8030"  # ResourceManager
      - "8031:8031"  # ResourceTracker
      - "8033:8033"  # ResourceManager admin
    volumes:
      - ./hadoop-conf:/etc/hadoop/conf
    networks:
      - datalake_network
    restart: always

  # YARN NodeManager - Exécution des tâches
  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop2.7.4-java8
    container_name: nodemanager
    depends_on:
      - resourcemanager
      - namenode
      - datanode
    env_file:
      - ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 resourcemanager:8088"
    ports:
      - "8042:8042"  # NodeManager Web UI
    volumes:
      - ./hadoop-conf:/etc/hadoop/conf
    networks:
      - datalake_network
    restart: always

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop2.7.4-java8
    hostname: historyserver
    depends_on:
      - resourcemanager
    environment:
      SERVICE_PRECONDITION: "resourcemanager:8088"
    networks:
      - datalake_network
    restart: always
  
networks:
  datalake_network:
    name: datalake_network
    driver: bridge

volumes:
  namenode:
  datanode:
  kafka_data:
  nifi_data:
  nifi_logs:
  nifi_conf:
  spark_data:
  hadoop_data:
  hbase_data:
  hue_data:
