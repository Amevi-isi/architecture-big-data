[yarn]
resourcemanager_host=resourcemanager
resourcemanager_port=8088
proxy_api_url=http://resourcemanager:8088
history_server_url=http://resourcemanager:19888

# Security configuration (if not using Kerberos)
#security_enabled=False

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs = hdfs://namenode:9000
webhdfs_url = http://namenode:50070/webhdfs/v1
webhdfs_timeout=120

[beeswax]
hive_server_host=hive-server
hive_server_port=10000
thrift_version=7
transport_mode=binary
server_conn_timeout=120
query_timeout_s=3600
close_queries=true
use_get_log_api=true

[hbase]
hbase_clusters = Cluster|hbase-master:16000
hbase_conf_dir = /opt/hbase/conf
thrift_transport=buffered

[spark]
livy_server_url=http://spark-master:8998
livy_server_session_kind=spark



[desktop]
disable_oidc=true
disable_saml=true
disable_salesforce=true
